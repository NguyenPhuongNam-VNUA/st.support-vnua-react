[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-care-core-ai"
version = "0.1.0"
description = "ST-Care VNUA Student Assistant - Core AI Microservice (RAG, LangGraph, LLM Gateway, MCP, Cache, Ingestion)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ST-Care Team", email = "dev@vnua.edu.vn" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "litellm>=1.40.0",
    "langgraph>=0.2.0,<2.0.0",
    "mcp>=2.1.1,<3.0.0",
    "httpx2>=2.12.0,<3.0.0",
    "jsonschema>=4.23.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17,<1.0.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "prometheus-client>=0.20.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "nh3>=0.2.18,<0.4.0",
    "rapidfuzz>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
local-models = [
    "torch>=2.4.0,<3.0.0",
    "transformers>=4.48.0,<6.0.0",
    "huggingface-hub>=0.27.0,<2.0.0",
]
onnx-models = [
    "onnxruntime>=1.20.0,<2.0.0",
    "optimum-onnx>=0.0.3,<1.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core_ai"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
