# Prometheus Configuration for ST-Care Core AI Observability
# Scrapes metrics from the core-ai FastAPI service and optional telemetry collectors.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # 1. ST-Care Core AI Microservice
  - job_name: "st-care-core-ai"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["core-ai:5001"]
        labels:
          app: "st-care"
          service: "core-ai"
          environment: "production"

  # 2. OpenTelemetry Collector Prometheus Exporter (optional monitoring profile)
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          app: "st-care"
          service: "otel-collector"
