groups:
  - name: st-care-core-ai
    rules:
      - alert: CoreAIHighErrorRate
        expr: sum(rate(core_ai_requests_total{status=~"5..|error"}[5m])) / clamp_min(sum(rate(core_ai_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Core AI error rate exceeds 5%"

      - alert: CoreAIHighNoEvidenceRatio
        expr: retrieval_no_evidence_ratio > 0.35
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retrieval no-evidence ratio is high"

      - alert: CoreAILocalModelFallbackSpike
        expr: sum(rate(core_ai_local_model_inference_seconds_count{outcome="fallback"}[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Local reranker or prompt guard fallback increased"

      - alert: CoreAIHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(core_ai_request_duration_seconds_bucket[5m]))) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Core AI p95 latency exceeds three seconds"
